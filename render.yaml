services:
  - type: web
    name: titan-space-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: WORKER_URL
        sync: false
      - key: WORKER_TOKEN
        sync: false
      - key: SITE_PASSWORD
        generateValue: true
